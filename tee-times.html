  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      getFirestore, collection, getDocs, doc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYat6m3-Lv46vfm6xcHLjTjRDq7NdCxAk",
      authDomain: "hackers-cup.firebaseapp.com",
      databaseURL: "https://hackers-cup-default-rtdb.firebaseio.com",
      projectId: "hackers-cup",
      storageBucket: "hackers-cup.appspot.com",
      messagingSenderId: "765736070872",
      appId: "1:765736070872:web:86a51c41916e7af75631ad",
      measurementId: "G-6E1M14F510"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const db = getDatabase(app);
    const firestore = getFirestore(app);
    const auth = getAuth(app);

    const CURRENT_EVENT_ID = "HC26";
    const CURRENT_EVENT_YEAR = 2026;

    const params = new URLSearchParams(location.search);
    let activeTeeDay = ['friday','saturday','sunday'].includes(params.get('day')) ? params.get('day') : 'friday';

    let users = [];
    let eventPlayers = new Map();
    let teeSheets = { friday: [], saturday: [], sunday: [] };
    let unsubTeeSheets = null;

    const $ = s => document.querySelector(s);

    function asString(v) { return v == null ? '' : String(v); }
    function escapeHtml(v) {
      return String(v || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    function toHcNumber(v) {
      if (v === undefined || v === null || v === '') return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function normalizeEventRecord(uid, data = {}) {
      const hc = toHcNumber(data.handicap);
      return {
        ambrosePartnerUid: asString(data.ambrosePartnerUid),
        ambrosePartnerUid2: asString(data.ambrosePartnerUid2),
        handicap: hc !== null ? hc : '',
        coming: !!data.coming,
      };
    }

    function getEventRecord(uid) {
      return eventPlayers.get(uid) || { ambrosePartnerUid: '', ambrosePartnerUid2: '', handicap: '', coming: false };
    }

    // Resolves the confirmed Ambrose team for `uid` among `pool` (a uid array). Mirrors the
    // mutual-confirmation rule scoring-sunday.html/tee-sheet.html use — see those files for the
    // full rationale. Works no matter which of the three members `uid` is — a third teammate's
    // own ambrosePartnerUid points at the captain too, but the captain's primary partner is
    // someone else, so that case is resolved separately (previously fell through to "no pair",
    // rendering the third player twice when visited before their captain). Returns [uid] alone
    // when unpaired.
    function resolveAmbroseTeamUids(uid, pool) {
      const rec = getEventRecord(uid);
      const pid = rec.ambrosePartnerUid;
      if (!pid || !pool.includes(pid)) return [uid];
      const prec = getEventRecord(pid);
      if (prec.ambrosePartnerUid === uid) {
        const team = [uid, pid];
        const thirdUid = rec.ambrosePartnerUid2 || prec.ambrosePartnerUid2;
        const thirdOwnerUid = rec.ambrosePartnerUid2 ? uid : (prec.ambrosePartnerUid2 ? pid : null);
        if (thirdUid && pool.includes(thirdUid)) {
          const trec = getEventRecord(thirdUid);
          if (trec.ambrosePartnerUid === thirdOwnerUid) team.push(thirdUid);
        }
        return team;
      }
      if (prec.ambrosePartnerUid2 === uid) {
        const team = [pid, uid];
        const p1Uid = prec.ambrosePartnerUid;
        if (p1Uid && pool.includes(p1Uid)) {
          const p1rec = getEventRecord(p1Uid);
          if (p1rec.ambrosePartnerUid === pid) team.splice(1, 0, p1Uid);
        }
        return team;
      }
      return [uid];
    }

    function numericHandicapFor(uid, record) {
      const raw = record.handicap !== '' && record.handicap != null ? Number(record.handicap) : NaN;
      return Number.isFinite(raw) ? raw : null;
    }

    function isShotgun(day) { return day !== 'saturday'; }

    function parseHoleLabel(s) {
      const m = String(s||'').trim().toUpperCase().match(/^(\d{1,2})([A-Z]?)$/);
      return m ? { num: Math.min(18,Math.max(1,parseInt(m[1],10))), letter: m[2] } : { num:1, letter:'' };
    }

    function parseTeeTime(s) {
      const str = String(s || '').trim().toUpperCase();
      const m = str.match(/^(\d{1,2})(?:[:.;,\-\s]?(\d{2}))?\s*(AM|PM|A|P)?\.?$/);
      if (!m) return 8 * 60;
      let h = Number(m[1]);
      const min = Number(m[2] || 0);
      if (h > 23 || min > 59) return 8 * 60;
      const mer = m[3] ? m[3][0] : '';
      if (mer === 'P' && h < 12) h += 12;
      if (mer === 'A' && h === 12) h = 0;
      return h * 60 + min;
    }

    function sortTeeSheetGroups(day) {
      const arr = teeSheets[day];
      if (!Array.isArray(arr)) return;
      if (isShotgun(day)) {
        arr.sort((a, b) => {
          const ha = parseHoleLabel(a.hole), hb = parseHoleLabel(b.hole);
          return ha.num - hb.num || ha.letter.localeCompare(hb.letter);
        });
      } else {
        arr.sort((a, b) => parseTeeTime(a.teeTime) - parseTeeTime(b.teeTime));
      }
    }

    // ── Data loading ──
    async function loadUsersAndEventPlayers() {
      const [rtdbSnap, firestoreUsersSnap, eventPlayersSnap] = await Promise.all([
        get(ref(db, "users")),
        getDocs(collection(firestore, "users")),
        getDocs(collection(firestore, "eventYears", CURRENT_EVENT_ID, "players")),
      ]);
      const rtdbData = rtdbSnap.exists() ? rtdbSnap.val() : {};
      const firestoreUsers = {};
      firestoreUsersSnap.forEach(d => { firestoreUsers[d.id] = d.data() || {}; });

      users = Object.keys(rtdbData).map(uid => {
        const r = rtdbData[uid] || {};
        const f = firestoreUsers[uid] || {};
        return {
          uid,
          displayName: r.displayName || f.displayName || "",
          hackerNumber: f.hackerNumber || r.hackerNumber || "",
        };
      });

      const dataByUid = {};
      eventPlayersSnap.forEach(d => { dataByUid[d.id] = d.data() || {}; });
      eventPlayers = new Map();
      users.forEach(u => {
        eventPlayers.set(u.uid, normalizeEventRecord(u.uid, dataByUid[u.uid] || {}));
      });
    }

    function watchTeeSheet() {
      if (unsubTeeSheets) unsubTeeSheets();
      unsubTeeSheets = onSnapshot(doc(firestore, 'eventYears', CURRENT_EVENT_ID), snap => {
        const saved = (snap.exists() ? snap.data() || {} : {}).teeSheets || {};
        teeSheets = {
          friday: Array.isArray(saved.friday) ? saved.friday : [],
          saturday: Array.isArray(saved.saturday) ? saved.saturday : [],
          sunday: Array.isArray(saved.sunday) ? saved.sunday : [],
        };
        render();
        $('#lastUpdated').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }, err => {
        console.error('Tee sheet stream failed:', err);
        $('#tsGroupsDisplay').innerHTML = `
          <div class="col-span-full text-center py-16 text-red-400 text-sm">
            Couldn't load the tee sheet right now.
          </div>`;
      });
    }

    // ── Render ──
    function render() {
      $('#eventLabel').textContent = `${CURRENT_EVENT_YEAR} · ${CURRENT_EVENT_ID}`;

      sortTeeSheetGroups(activeTeeDay);
      const groups = teeSheets[activeTeeDay];
      const display = $('#tsGroupsDisplay');
      const empty = $('#tsEmpty');

      ['friday','saturday','sunday'].forEach(day => {
        const badge = $(`#tab-badge-${day}`);
        if (!badge) return;
        const n = teeSheets[day].length;
        badge.textContent = n;
        badge.classList.toggle('hidden', n === 0);
      });

      if (!groups.length) {
        display.innerHTML = '';
        display.classList.add('hidden');
        empty.classList.remove('hidden');
        empty.classList.add('flex');
        return;
      }
      display.classList.remove('hidden');
      empty.classList.add('hidden');
      empty.classList.remove('flex');

      display.innerHTML = groups.map((group, gi) => {
        const players = Array.isArray(group.players) ? group.players : [];

        let playersHtml = '';
        if (activeTeeDay === 'sunday') {
          const done = new Set();
          for (const uid of players) {
            if (done.has(uid)) continue;
            const team = resolveAmbroseTeamUids(uid, players);
            if (team.length >= 2) {
              team.forEach(m => done.add(m));
              const isTrio = team.length >= 3;
              const teamHc = isTrio ? 0 : (() => {
                const h1 = numericHandicapFor(team[0], getEventRecord(team[0])), h2 = numericHandicapFor(team[1], getEventRecord(team[1]));
                return h1 !== null && h2 !== null ? ((h1 + h2) / 4).toFixed(2) : null;
              })();
              const label = isTrio ? 'Three-ball · Scratch (HC 0)' : `Pair${teamHc ? ' · Team HC ' + teamHc : ''}`;
              const rowsHtml = team.map(m => {
                const u = users.find(x => x.uid === m), h = numericHandicapFor(m, getEventRecord(m));
                return `
                  <div class="flex items-center justify-between py-0.5">
                    <span class="text-xs font-medium text-white truncate">${escapeHtml(u?.displayName || '?')}</span>
                    ${h !== null ? `<span class="text-[10px] text-gray-500 font-mono shrink-0">HC ${h}</span>` : ''}
                  </div>`;
              }).join('');
              playersHtml += `
                <div class="rounded-lg border ${isTrio ? 'border-purple-400/25 bg-purple-400/5' : 'border-hackers-sky/25 bg-hackers-sky/5'} px-2.5 py-2 mb-1.5 last:mb-0">
                  <div class="text-[9px] font-bold text-hackers-light uppercase tracking-widest mb-1.5">${label}</div>
                  ${rowsHtml}
                </div>`;
            } else {
              done.add(uid);
              const rec = getEventRecord(uid);
              const u = users.find(x => x.uid === uid), hc = numericHandicapFor(uid, rec);
              playersHtml += `
                <div class="flex items-center justify-between py-1.5 border-b border-white/10 last:border-b-0">
                  <span class="text-xs font-medium text-white truncate">${escapeHtml(u?.displayName || uid.slice(0,8))}</span>
                  ${hc !== null ? `<span class="text-[10px] text-gray-500 font-mono shrink-0">HC ${hc}</span>` : ''}
                  <span class="text-[10px] text-amber-400 shrink-0 ml-1.5">no pair</span>
                </div>`;
            }
          }
        } else {
          playersHtml = players.map(uid => {
            const u = users.find(x => x.uid === uid), rec = getEventRecord(uid), hc = numericHandicapFor(uid, rec);
            return `
              <div class="flex items-center justify-between py-1.5 border-b border-white/10 last:border-b-0">
                <span class="text-xs font-medium text-white truncate">${escapeHtml(u?.displayName || uid.slice(0,8))}</span>
                ${hc !== null ? `<span class="text-[10px] text-gray-500 font-mono shrink-0">HC ${hc}</span>` : ''}
              </div>`;
          }).join('');
        }

        return `
          <div class="glass-card rounded-2xl overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-3 pt-3 pb-2">
              <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-md bg-hackers-sky/15 border border-hackers-sky/20 flex items-center justify-center text-[10px] font-bold text-hackers-sky shrink-0">${gi+1}</span>
                <span class="text-[11px] font-semibold text-gray-300">Group ${gi+1}</span>
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded-full border border-white/10 font-mono text-gray-300 bg-white/5">${players.length}/4</span>
            </div>
            <div class="flex items-center gap-3 px-3 pb-2.5 border-b border-white/10 text-xs text-gray-400">
              <span>Hole <span class="text-white font-mono">${escapeHtml(asString(group.hole || 1))}</span></span>
              <span class="text-white/20">·</span>
              <span>Time <span class="text-white font-mono">${escapeHtml(asString(group.teeTime || ''))}</span></span>
            </div>
            <div class="px-3 py-2 flex-1">
              ${playersHtml || '<div class="text-xs text-gray-600 py-2">No players</div>'}
            </div>
          </div>`;
      }).join('');

      lucide.createIcons();
    }

    function setActiveDay(day) {
      activeTeeDay = day;
      document.querySelectorAll('.ts-day-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tsDay === day));
      updateUrl();
      render();
    }

    function updateUrl() {
      const url = new URL(location.href);
      url.searchParams.set('day', activeTeeDay);
      history.replaceState(null, '', url);
    }

    document.querySelectorAll('.ts-day-tab').forEach(btn => {
      btn.addEventListener('click', () => setActiveDay(btn.dataset.tsDay));
      if (btn.dataset.tsDay === activeTeeDay) btn.classList.add('active');
      else btn.classList.remove('active');
    });

    // ── Init ──
    // Rejects after `ms` if `promise` hasn't settled — used so a stalled network call
    // (no built-in timeout on Firebase's own promises) can't leave the page hanging
    // forever. The underlying promise keeps running in the background regardless; this
    // only stops *us* from waiting on it indefinitely.
    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
      ]);
    }

    function showStallBanner(message) {
      const banner = $('#tsStallBanner');
      const msgEl = $('#tsStallMessage');
      if (msgEl) msgEl.textContent = message;
      if (banner) banner.classList.remove('hidden');
    }
    function hideStallBanner() {
      $('#tsStallBanner')?.classList.add('hidden');
    }

    // Firebase Auth normally resolves onAuthStateChanged quickly, but some in-app/embedded
    // browsers block the storage it relies on and it can simply never fire — previously
    // that left this page stuck on "Loading…" forever with no way out but to leave.
    const authStallTimer = setTimeout(() => {
      showStallBanner("Still signing you in — this shouldn't take this long.");
    }, 8000);

    onAuthStateChanged(auth, async (user) => {
      clearTimeout(authStallTimer);
      hideStallBanner();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      lucide.createIcons();
      try {
        // A stalled Firestore/RTDB request has no built-in timeout — without this,
        // one slow/dropped request on a poor connection would block watchTeeSheet()
        // (and the rest of the page) from ever starting.
        await withTimeout(loadUsersAndEventPlayers(), 10000);
      } catch (err) {
        console.error('Failed to load players:', err);
        showStallBanner("Player names/handicaps are taking a while to load — tee times below will still update live.");
        // Keep trying in the background; apply it whenever it actually lands instead
        // of leaving names permanently blank for the rest of the session.
        loadUsersAndEventPlayers().then(() => { hideStallBanner(); render(); }).catch(() => {});
      }
      watchTeeSheet();
      setInterval(() => {
        loadUsersAndEventPlayers().then(() => {
          render();
        }).catch(() => {});
      }, 5 * 60 * 1000);
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
